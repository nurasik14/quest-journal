    category: treat
    difficulty: easy
    minutes: 20
    coins: 10
    cooldown_days: 7
  - id: treat-cafe-study
    title: "Study for an hour at a café you like, and enjoy the drink"
    why: "Work paired with a pleasure goes down easier. An old apothecary trick."
    category: treat
    difficulty: medium
    minutes: 75
    coins: 20
    cooldown_days: 5
    cost: low
  - id: treat-anime-earned
