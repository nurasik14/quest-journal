# Weekly boss pool (fallback for the weekly boss when `claude -p` is unavailable).
# Added by quest-builder in sprint M1 (backlog B2) from docs/brainstorm/motivation.md §2.2.
# Fields: id, title, why, category, type (make|learn|explore|connect|restore), checkpoints (≤4).
# Coins are set by the server (boss tariff), never read from this file.
boss:
  - id: boss-cafe-cartographer
    title: "The Café Cartographer"
    why: "Three new cafés, one ranking page. A map of where the good brews hide."
    category: adventure
    type: explore
    checkpoints:
      - "Visit a new café (1 of 3)"
      - "Visit a new café (2 of 3)"
      - "Visit a new café (3 of 3)"
      - "Write a mini-review page ranking them"
  - id: boss-paper-autopsy
    title: "Paper Autopsy"
    why: "Open up one ML paper and see what's actually inside. Gently, like a specimen."
    category: learning
    type: learn
    checkpoints:
      - "Choose an ML paper"
      - "Read it fully"
      - "Reimplement the core idea in a toy notebook"
      - "Write a 10-bullet explainer"
  - id: boss-yonkoma-week
    title: "Yonkoma Week"
    why: "Four little comics on four different days. Ink keeps better than memory."
    category: creative
    type: make
    checkpoints:
      - "Draw a 4-panel comic (1 of 4)"
      - "Draw a 4-panel comic (2 of 4)"
      - "Draw a 4-panel comic (3 of 4)"
      - "Draw a 4-panel comic (4 of 4) and show one to a friend"
  - id: boss-kaggle-trial
    title: "The Kaggle Trial"
    why: "A baseline, two improvements, and notes on what helped. Proper experiment records."
    category: learning
    type: learn
    checkpoints:
      - "Make a baseline submission"
      - "First improvement iteration"
      - "Second improvement iteration"
      - "Write a short note on what helped"
  - id: boss-five-morning-tonics
    title: "Five Morning Tonics"
    why: "Move before ten on four different mornings. The body remembers the dose."
    category: body
    type: restore
    checkpoints:
      - "Move 20+ minutes before 10:00 (morning 1)"
      - "Move 20+ minutes before 10:00 (morning 2)"
      - "Move 20+ minutes before 10:00 (morning 3)"
      - "Move 20+ minutes before 10:00 (morning 4)"
  - id: boss-jade-pavilion
    title: "Gathering in the Jade Pavilion"
    why: "Host a small manga swap or study night. Good company is an old remedy."
    category: social
    type: connect
    checkpoints:
      - "Pick a date"
      - "Invite 2 or more people"
      - "Host the manga swap or study night"
      - "Send a thank-you message"
  - id: boss-exam-antidote
    title: "The Exam Antidote"
    why: "For exam weeks: one course, studied properly, then one evening fully off."
    category: learning
    type: learn
    checkpoints:
      - "Make a summary sheet for one course"
      - "Do one timed past paper"
      - "Review your mistakes"
      - "Take one full rest evening"
  - id: boss-unknown-district
    title: "Unknown District Expedition"
    why: "Pick a district you've never walked. Bring back photos and one ledger page."
    category: adventure
    type: explore
    checkpoints:
      - "Pick a district"
      - "Go there"
      - "Find one café or bookstore"
      - "Take 10 photos and write one ledger page"
  - id: boss-spring-cleaning
    title: "Spring Cleaning of the Apothecary"
    why: "A tidy workbench makes every remedy easier. Four small sweeps."
    category: care
    type: restore
    checkpoints:
      - "Clear the desk"
      - "Do the laundry"
      - "Clean up Downloads and the desktop"
      - "Back up your notes"
  - id: boss-sleep-ledger
    title: "The Sleep Ledger"
    why: "In bed by 23:30 on five nights out of seven. Sleep is the strongest tonic I know."
    category: care
    type: restore
    checkpoints:
      - "In bed by 23:30 on 2 nights"
      - "In bed by 23:30 on 3 nights"
      - "In bed by 23:30 on 4 nights"
      - "In bed by 23:30 on 5 nights"
