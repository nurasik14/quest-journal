    difficulty: easy
    coins: 10
    cooldown_days: 6
  - id: care-nap-20
    title: "Rest with your eyes closed for 20 minutes"
    why: "Even the emperor's guards switch shifts. Close your eyes."
    category: care
    difficulty: easy
    minutes: 20
    coins: 10
    cooldown_days: 1
  - id: care-early-bed
    title: "Lights out by 23:30, phone charging out of reach"
