    difficulty: easy
    minutes: 20
    coins: 10
    cooldown_days: 3
  - id: treat-manga-after-hard
    title: "Read manga for 30 minutes right after your hardest task"
    why: "Sweet medicine after the bitter dose. That's how I'd prescribe it."
    category: treat
